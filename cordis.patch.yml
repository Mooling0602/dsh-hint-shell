# dsh-hint-shell bundle patch.
#
# Referenced by package.json `dsh.bundle.patch`. Installing the package into a
# profile appends it to that profile's layer stack, and this row loads the host
# half (dist/index.js) as an ordinary Cordis plugin. The browser half rides the
# `dsh.client` scan (dist/client.js).
#
# The host half does the real work: it intercepts a `!` line at `agent/pre-step`,
# runs it through the composed `subprocess` service, and appends the call and its
# result to the session log. The browser half adds the composer hints and this
# plugin's settings page.
#
# The row id is also the settings namespace the browser half binds, so renaming
# it would detach the settings page from its Host entry.
- insert:
    - id: dsh-hint-shell
      name: 'dsh-hint-shell'
